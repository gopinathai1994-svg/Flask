<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Prediction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #6366f1 0%, transparent 35%),
                radial-gradient(circle at bottom right, #06b6d4 0%, transparent 35%),
                linear-gradient(135deg, #0f172a, #1e293b);

            padding: 20px;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 480px;
        }

        /* Card */
        .card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 24px;
            padding: 38px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.30),
                0 8px 20px rgba(0, 0, 0, 0.12);

            backdrop-filter: blur(15px);

            animation: slideUp 0.7s ease;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: auto;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 20px;

            background: linear-gradient(
                135deg,
                #6366f1,
                #06b6d4
            );

            color: white;
            font-size: 32px;

            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35);
        }

        .header h1 {
            margin-top: 18px;
            font-size: 28px;
            color: #111827;
            font-weight: 700;
        }

        .header p {
            margin-top: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        /* Input + Select */
        input,
        select {
            width: 100%;
            height: 52px;

            padding: 0 16px;

            border: 1px solid #d1d5db;
            border-radius: 12px;

            background: #f9fafb;

            font-size: 15px;
            color: #111827;

            outline: none;

            transition: all 0.25s ease;
        }

        input:focus,
        select:focus {
            border-color: #6366f1;

            background: white;

            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.12);

            transform: translateY(-1px);
        }

        input:hover,
        select:hover {
            border-color: #9ca3af;
        }

        /* Select */
        select {
            cursor: pointer;
        }

        /* Predict Button */
        .predict-btn {
            width: 100%;
            height: 54px;

            margin-top: 8px;

            border: none;
            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #4f46e5,
                    #06b6d4
                );

            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(79, 70, 229, 0.35);

            transition: all 0.3s ease;
        }

        .predict-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 15px 30px rgba(79, 70, 229, 0.45);
        }

        .predict-btn:active {
            transform: translateY(0);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 24px;

            color: #9ca3af;
            font-size: 12px;
        }

        .footer span {
            color: #6366f1;
            font-weight: 600;
        }

        /* Animation */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile */
        @media (max-width: 500px) {

            .card {
                padding: 28px 22px;
                border-radius: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .icon {
                width: 60px;
                height: 60px;
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <!-- Header -->
            <div class="header">

                <div class="icon">
                    🎓
                </div>

                <h1>Student Performance</h1>

                <p>
                    AI-powered student performance prediction
                </p>

            </div>


            <!-- Form -->
            <form method="POST" action="/predict">

                <!-- Attendance -->
                <div class="form-group">

                    <label for="attendance">
                        Attendance
                    </label>

                    <input
                        type="number"
                        id="attendance"
                        name="attendance"
                        placeholder="Enter attendance percentage"
                        min="0"
                        max="100"
                        required
                    >

                </div>


                <!-- Monthly Mark -->
                <div class="form-group">

                    <label for="monthly_mark">
                        Monthly Mark
                    </label>

                    <input
                        type="number"
                        id="monthly_mark"
                        name="monthly_mark"
                        placeholder="Enter monthly exam mark"
                        min="0"
                        max="100"
                        step="0.01"
                        required
                    >

                </div>


                <!-- Section -->
                <div class="form-group">

                    <label for="section">
                        Section
                    </label>

                    <select
                        id="section"
                        name="section"
                        required
                    >

                        <option value="" disabled selected>
                            Select student section
                        </option>

                        <option value="A">Section A</option>
                        <option value="B">Section B</option>
                        <option value="C">Section C</option>
                        <option value="D">Section D</option>

                    </select>

                </div>


                <!-- Button -->
                <button
                    type="submit"
                    class="predict-btn"
                >
                    🔮 Predict Performance
                </button>

            </form>


            <!-- Footer -->
            <div class="footer">
                Powered by <span>AI & Machine Learning</span>
            </div>

        </div>

    </div>

</body>
</html>
